services:
  postgres:
    image: postgres:17-alpine
    container_name: toolbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toolbridge
      POSTGRES_PASSWORD: toolbridge
      POSTGRES_DB: toolbridge
    ports:
      - "5432:5432"
    volumes:
      - toolbridge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  toolbridge-pgdata:
